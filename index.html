<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/taskflow.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TaskFlow gives students one calm, dependable place to capture tasks, organize commitments across GDG, Academics, and Personal categories, and track progress." />
    <meta name="color-scheme" content="light dark" />
    <title>TaskFlow — Student Productivity Dashboard</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <!-- FOUC prevention script -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('taskflow:theme:v1');
          var isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="color-scheme"]');
            if (meta) meta.content = 'dark';
          } else if (stored === 'light') {
            document.documentElement.classList.remove('dark');
            var meta = document.querySelector('meta[name="color-scheme"]');
            if (meta) meta.content = 'light';
          }
        } catch (e) {
          // Ignore storage access errors in private mode
        }
      })();
    </script>
  </head>
  <body class="bg-[#EAECEF] dark:bg-[#0c0e12] text-slate-900 dark:text-slate-100 antialiased selection:bg-brand-500 selection:text-white min-h-[100dvh] w-full m-0 p-0">
    <div id="root" class="min-h-[100dvh] w-full flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
